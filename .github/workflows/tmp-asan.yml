name: tmp asan speed
on:
  push:
    branches: [probe/dev1-asan]
permissions:
  contents: read
jobs:
  asan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        variant: [O0, O1, O0-ctx2, O1-ctx2]
        exclude:
          - os: macos-15
            variant: O0-ctx2
    name: ${{ matrix.os }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: ${{ endsWith(matrix.variant, 'ctx2') && 'detect_leaks=0:malloc_context_size=2' || 'detect_leaks=0' }}
      OPT: ${{ startsWith(matrix.variant, 'O1') && '-O1 -fno-omit-frame-pointer' || '' }}
      EXTRA: ${{ matrix.os == 'ubuntu-24.04' && '-Wno-stringop-overflow -Wno-stringop-overread' || '' }}
      RUN: ${{ matrix.os == 'ubuntu-24.04' && 'nix develop -c' || '' }}
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-24.04'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - if: matrix.os == 'macos-15'
        run: brew install ninja sdl3
      - name: Build
        run: |
          mkdir -p out
          $RUN cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined $OPT $EXTRA"
          s=$(date +%s); $RUN cmake --build build > out/build.log; echo "build_s $(( $(date +%s)-s ))" | tee out/times.txt
      - name: Test
        run: |
          set -o pipefail
          $RUN ctest --test-dir build --timeout 900 -j 4 2>&1 | tee out/ctest.log | tail -15 || true
          echo "nproc $(getconf _NPROCESSORS_ONLN)" >> out/times.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asan-${{ matrix.os }}-${{ matrix.variant }}
          path: out/
