# SPDX-License-Identifier: GPL-3.0-or-later
# Every push to any branch and every pull request: build and run the tests on macOS (Apple Silicon and Intel),
# once in Release and once with AddressSanitizer + UndefinedBehaviorSanitizer. A compiler warning fails the build.
# Tests that need the CD's data skip themselves (there is no game data in CI).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]     # Apple Silicon and Intel
        build: [release, sanitizers]
        include:
          - build: release
            cmake: -DCMAKE_BUILD_TYPE=Release
          - build: sanitizers
            cmake: -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
    name: ${{ matrix.runner }} ${{ matrix.build }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install ninja sdl3
      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.cmake }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | grep -v '^ld: warning' | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(sysctl -n hw.ncpu)"
