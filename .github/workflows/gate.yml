# SPDX-License-Identifier: GPL-3.0-or-later
# The gate in CI, being built (by hand only until the CD data's blob exists; later the merge queue runs it): ctest with the CD data in Release (5 shards) and with
# AddressSanitizer + UndefinedBehaviorSanitizer (8 shards), split by cost (tools/ci_shards.py, tests/ci/costs-*.txt); the job "gate" is the one check to require.
# The data comes through the action cd-data and the environment cd-data, whose secrets GitHub gives only to main and the merge queue. The repository is public: nothing made
# from the CD's data goes into an artifact, a cache or a log (no artifact is uploaded here; the caches hold the compiler's objects; no test's output is printed).
# Never on pull_request_target.
name: Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        build: [release, asan]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - { build: release, shard: 6 }
          - { build: release, shard: 7 }
          - { build: release, shard: 8 }
        include:
          - build: release
            shards: 5
            cmake: -DCMAKE_BUILD_TYPE=Release
          - build: asan
            shards: 8
            cmake: -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -Wno-stringop-overflow -Wno-stringop-overread"
    name: ${{ matrix.build }} · shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: cd-data
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      # first, right after the checkout: no third-party action or install runs ahead of the step that holds the key. It is also before the configure, which registers the CD tests only
      # when original/ is there
      - uses: ./.github/actions/cd-data
        with:
          age-key: ${{ secrets.CD_AGE_KEY }}
          repo-token: ${{ secrets.CD_REPO_TOKEN }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086   # v31
      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-ubuntu-24.04-${{ matrix.build == 'release' && 'release' || 'sanitizers' }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-24.04-${{ matrix.build == 'release' && 'release' || 'sanitizers' }}-
      - name: Configure
        run: nix develop -c cmake -S . -B build -G Ninja ${{ matrix.cmake }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          nix develop -c cmake --build build 2>&1 | tee build.log
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Test (this shard's)
        run: |
          nix develop -c ctest --test-dir build --show-only=json-v1 > tests.json
          select=$(python3 -I tools/ci_shards.py tests.json tests/ci/costs-${{ matrix.build }}.txt ${{ matrix.shards }} ${{ matrix.shard }})
          # the log is public: ctest's own lines only (each test's name, result and time, and the list of the failed ones). Never --output-on-failure or -V: a test's output can
          # carry what it read from the CD (paths, names, dumps). To see why one failed, run it on a machine that has the data. tests/cd_data_fetch.sh checks this
          nix develop -c ctest --test-dir build -I "$select" --timeout 1200 -j "$(nproc)"
      - name: Delete the CD data
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/cd" "${GITHUB_WORKSPACE:?}/original"

  gate:
    name: gate
    needs: [test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed
        run: test "${{ needs.test.result }}" = success
