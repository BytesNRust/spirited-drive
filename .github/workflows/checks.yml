# SPDX-License-Identifier: GPL-3.0-or-later
# The checks of every push to any branch and every pull request, two jobs side by side:
#   macos    Apple Silicon (macos-15), Release with Studio (the editor, the default configuration): every test; a compiler warning fails.
#   windows  MSYS2 UCRT64 gcc: everything the Windows version builds, every test, the exe's smoke; a compiler warning fails (plan W1).
# The rest (AddressSanitizer + UndefinedBehaviorSanitizer, Intel, and the game-only release configuration of the downloads) runs every night: checks-nightly.yml.
# Pushes that touch only docs or notes (*.md, docs/, notes/) run nothing. By hand too (Actions > Checks > Run workflow).
# The Windows job keeps going past a broken target (ninja -k 0) and runs ctest on all, so its summary lists everything that fails, not the first thing; the logs go up as an artifact.
# Studio (the editor, TNFS_EDITOR) is built on macOS only: it is not part of the Windows version. ccache keeps the objects between runs: main saves the cache, every branch restores it.
# Tests that need the CD's data skip themselves (there is no game data in CI). tests/exe_smoke.sh is the smoke of the exe (not a ctest: CI's macOS has no `timeout`).
name: Checks

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'notes/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'notes/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Apple Silicon, Release, Studio built (TNFS_EDITOR is ON by default): every test of the game and of Studio.
  macos:
    name: macos-15 release (with Studio)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install ninja sdl3 ccache
      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-macos-15-release-${{ github.sha }}
          restore-keys: ccache-macos-15-release-
      - name: Configure
        run: |
          ccache -z
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Save the ccache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-macos-15-release-${{ github.sha }}
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | grep -v '^ld: warning' | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(sysctl -n hw.ncpu)"

  windows:
    name: windows ucrt64 gcc
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c   # v2.34.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ccache
            git
            diffutils
      - name: A /tmp for the programs that name one (the native programs read it as D:\tmp)
        run: mkdir -p /d/tmp
      - name: Configure
        run: |
          mkdir -p out
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_EDITOR=OFF 2>&1 | tee out/configure.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build (keeps going)
        id: build
        continue-on-error: true
        run: |
          cmake --build build -- -k 0 2>&1 | tee out/build.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Test (all of them)
        id: test
        continue-on-error: true
        run: |
          ctest --test-dir build --output-on-failure --timeout 300 -j "$(nproc)" 2>&1 | tee out/ctest.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Smoke (the exe starts and leaves cleanly)
        id: smoke
        continue-on-error: true
        run: |
          sh tests/exe_smoke.sh build/tnfs.exe 2>&1 | tee out/smoke.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: What fails
        if: always()
        run: |
          {
            echo "## Windows (UCRT64 gcc): build ${{ steps.build.outcome }}, tests ${{ steps.test.outcome }}, smoke ${{ steps.smoke.outcome }}"
            echo
            echo "### Build targets that failed"
            grep -E '^FAILED: ' out/build.log | sed 's/^FAILED: //' | sort -u | sed 's/^/- `/; s/$/`/' || true
            echo
            echo "### First error of each failed target (cut)"
            echo '```'
            grep -E 'error:|undefined reference|fatal error' out/build.log | sort -u | head -80 | cut -c1-220 || true
            echo '```'
            echo
            echo "### Tests that failed"
            grep -E '^ *[0-9]+/[0-9]+ Test +#[0-9]+: .*\*\*\*|^\s+[0-9]+ - ' out/ctest.log | sed 's/^ *//' | sort -u | head -300 | sed 's/^/- /' || true
            echo
            echo "### ctest summary"
            grep -E 'tests passed|tests failed|Total Test time' out/ctest.log || echo "(no ctest summary: the build did not leave a test run)"
            echo
            echo "Warnings in the build: $(grep -c 'warning:' out/build.log || true)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: windows-ucrt64-logs
          path: out/
          if-no-files-found: warn
      - name: No compiler warnings
        if: always()
        run: |
          if grep 'warning:' out/build.log | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Fail the job when the build or the tests failed
        if: steps.build.outcome != 'success' || steps.test.outcome != 'success' || steps.smoke.outcome != 'success'
        run: |
          echo "build: ${{ steps.build.outcome }}, tests: ${{ steps.test.outcome }}, smoke: ${{ steps.smoke.outcome }} (the list is in the summary)"
          exit 1
