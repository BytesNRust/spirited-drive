# SPDX-License-Identifier: GPL-3.0-or-later
# A test build on demand (Actions > Build Test > Run workflow): the universal macOS app (Apple Silicon + Intel) and its
# DMG, the Windows zip and installer, and the Linux AppImage, from the branch you pick, as a downloadable artifact. Nothing is released or tagged. The version is the usual
# <version>-dev+<hash>, so the game's update check stays off in these builds. The DMG holds the game only (Spirited Drive.app);
# the `studio` input adds Spirited Drive Studio.app for the owner's internal test apps.
# CACHES: SDL's build on macOS (keyed by SDL_COMMIT) and ccache on Windows (the universal macOS build has several -arch per compile, which ccache cannot keep), so a test build is quick. A run is never cancelled by a newer one (no concurrency group): a build the
# owner asked for is never cut. The release workflows use NO caches: clean builds, nothing that a poisoned cache could reach.
# update_test: the UPDATE NOTICE test. The build is the release configuration but stamps an OLD version (-updatetest), so the game's real update check,
# which release builds do, runs against the live latest release and must show the notice; a step runs that check headless and fails if it does not say
# "newer version available" (the same check runs weekly in check-app-update-infra.yml, its local part nightly in nightly-checks.yml). The artifact is named UPDATE-TEST and its version reads 0.0.1-updatetest: not for players. A release workflow never sets it.
name: Build Test

on:
  workflow_dispatch:
    inputs:
      studio:
        description: "Also build and package Spirited Drive Studio (for internal test apps; the downloads are the game only)"
        type: boolean
        default: false
      update_test:
        description: "Update notice test: stamp an old version so the real update check finds the live latest release newer (not for players)"
        type: boolean
        default: false
      update_test_version:
        description: "The old version update_test stamps (MAJOR.MINOR.PATCH)"
        type: string
        default: "0.0.1"

permissions:
  contents: read

env:
  SDL_TAG: release-3.4.10                                   # the SDL the game is developed against
  SDL_COMMIT: 8e37db5e797b6167f3a00d697d816a684bd259c7      # that tag's commit: a moved tag cannot change the build
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0             # the version's hash comes from the history
          persist-credentials: false

      - name: Install tools
        run: brew install ninja

      - name: Restore SDL 3 (universal), built before
        id: sdl
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-universal-macos-15-${{ env.SDL_COMMIT }}

      - name: Build SDL 3 (universal)
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" fetch -q --depth 1 https://github.com/libsdl-org/SDL.git "$SDL_COMMIT"
          git -C "$RUNNER_TEMP/SDL" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF \
                -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build "$RUNNER_TEMP/SDL/build"
          cmake --install "$RUNNER_TEMP/SDL/build"

      - name: Save SDL 3
        if: steps.sdl.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-universal-macos-15-${{ env.SDL_COMMIT }}


      - name: Build the game (universal, release)
        env:
          UPDATE_TEST_FLAG: ${{ inputs.update_test && format('-DTNFS_UPDATE_TEST_VERSION={0}', inputs.update_test_version) || '' }}
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON \
                -DTNFS_EDITOR=${{ inputs.studio && 'ON' || 'OFF' }} \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" $UPDATE_TEST_FLAG
          cmake --build build/rel


      - name: Test (Apple Silicon)
        run: ctest --test-dir build/rel --output-on-failure

      - name: Update notice, the real check against the live API
        if: inputs.update_test
        run: |
          python3 tests/update_check_e2e.py live build/rel/tnfs
          python3 tests/update_check_e2e.py local build/rel/tnfs

      - name: Package
        env:
          STUDIO: ${{ inputs.studio && '1' || '0' }}
        run: |
          [ "$STUDIO" = 1 ] || export GAME_ONLY=1
          [ "$STUDIO" != 1 ] || export REQUIRE_EDITOR=1
          icon=""
          [ -f data/icon/tnfs.icns ] && icon=data/icon/tnfs.icns
          tools/package_macos.sh build/rel dist $icon
          lipo -archs "dist/Spirited Drive.app/Contents/MacOS/tnfs" | grep -q arm64
          lipo -archs "dist/Spirited Drive.app/Contents/MacOS/tnfs" | grep -q x86_64
          cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: The DMG holds only what it should
        env:
          STUDIO: ${{ inputs.studio && '1' || '0' }}
        run: tools/check_dmg_contents.sh dist/*.dmg "$STUDIO"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: spirited-drive-macos-${{ inputs.update_test && 'UPDATE-TEST-' || '' }}${{ github.sha }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0             # the version's hash comes from the history
          persist-credentials: false

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c   # v2.34.0
        with:
          msystem: UCRT64
          update: false
          cache: true   # the MSYS2 install and its packages (pinned action)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ccache
            git

      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-windows-ucrt64-release-${{ github.sha }}
          restore-keys: ccache-windows-ucrt64-release-

      - name: Build the game (release)
        env:
          UPDATE_TEST_FLAG: ${{ inputs.update_test && format('-DTNFS_UPDATE_TEST_VERSION={0}', inputs.update_test_version) || '' }}
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $UPDATE_TEST_FLAG
          cmake --build build/rel --target tnfs

      - name: Save the ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-windows-ucrt64-release-${{ github.sha }}

      - name: Update notice, the real check against the live API (Windows' own curl first on the PATH)
        if: inputs.update_test
        run: |
          export PATH="/c/Windows/System32:$PATH"
          python tests/update_check_e2e.py live build/rel/tnfs.exe
          python tests/update_check_e2e.py local build/rel/tnfs.exe

      - name: Package
        run: |
          tools/package_windows.sh build/rel dist
          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
          cmake -E tar tf *.zip | grep -E 'Spirited Drive\.exe|SDL3\.dll|data/car_masks' | head -5

      - name: The package runs by itself
        # a clean Windows has none of MSYS2's folders: unpack into a new folder and start the exe with only Windows' own on PATH
        # (--mods-list opens no window and exits); a DLL missing from the zip makes the load fail (exit 0xC0000135) here and not on the runner's PATH
        run: |
          rm -rf unpacked && mkdir unpacked
          (cd unpacked && cmake -E tar xf ../dist/*.zip)
          ls unpacked/*/ | grep -q 'SDL3.dll'
          ls "unpacked/Spirited Drive/LICENSES/third-party"/*/* | grep -q . || { echo "no DLL licence texts in the package" >&2; exit 1; }
          mkdir user-clean
          env PATH=/c/Windows/System32:/c/Windows "unpacked/Spirited Drive/Spirited Drive.exe" --user "$PWD/user-clean" --mods-list

      - name: Inno Setup (a fixed version, its SHA256 checked; the runner's own is used when it has one)
        # 6.7.4 from the project's GitHub release; the hash is the one in the publisher's signed innosetup-6.7.4.exe.issig (file-hash)
        run: |
          if ! command -v ISCC >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
            echo "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c  $RUNNER_TEMP/innosetup.exe" | sha256sum -c -
            MSYS2_ARG_CONV_EXCL='*' "$RUNNER_TEMP/innosetup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /SP-
          fi

      - name: The installer (built from the zip, so it cannot differ from it) (and its sums)
        run: |
          tools/package_windows_installer.sh dist/*.zip dist
          cd dist && sha256sum *.zip *-setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: The installer installs, updates and uninstalls (the player's folder is kept)
        run: tools/installer_smoke.sh dist/*-setup.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: spirited-drive-windows-${{ inputs.update_test && 'UPDATE-TEST-' || '' }}${{ github.sha }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  linux:
    # built on the oldest Ubuntu the AppImage is for: its glibc (2.35) is the oldest it runs with. No nix here: a nix build wants nix's own libraries.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0             # the version's hash comes from the history
          persist-credentials: false

      - name: Install tools and the headers SDL3 is built with
        # SDL opens these libraries itself when it runs (nothing of them travels in the AppImage); what has no header here is left out of the build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
              libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
              libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: SDL 3 (static)
        run: |
          git init -q "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" fetch -q --depth 1 https://github.com/libsdl-org/SDL.git "$SDL_COMMIT"
          git -C "$RUNNER_TEMP/SDL" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
                -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build "$RUNNER_TEMP/SDL/build"
          cmake --install "$RUNNER_TEMP/SDL/build"
          # a build without one of these would still compile, and then show no window or play no sound on a player's machine
          for driver in VIDEO_DRIVER_X11 VIDEO_DRIVER_WAYLAND AUDIO_DRIVER_PULSEAUDIO AUDIO_DRIVER_PIPEWIRE AUDIO_DRIVER_ALSA; do
            grep -rqE "^#define SDL_$driver 1" "$RUNNER_TEMP/SDL/build" || { echo "SDL was built without $driver" >&2; exit 1; }
          done

      - name: Build the game (release)
        env:
          UPDATE_TEST_FLAG: ${{ inputs.update_test && format('-DTNFS_UPDATE_TEST_VERSION={0}', inputs.update_test_version) || '' }}
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" $UPDATE_TEST_FLAG
          set -o pipefail
          cmake --build build/rel --target tnfs 2>&1 | tee build.log
          if grep 'warning:' build.log | sort -u | grep .; then
            echo "the build has compiler warnings" >&2
            exit 1
          fi

      - name: Update notice, the real check against the live API
        if: inputs.update_test
        run: |
          python3 tests/update_check_e2e.py live build/rel/tnfs
          python3 tests/update_check_e2e.py local build/rel/tnfs

      - name: Package (appimagetool and its runtime at fixed versions, their SHA256 checked)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime" SDL_LICENSE="$RUNNER_TEMP/SDL/LICENSE.txt" \
              tools/package_appimage.sh build/rel dist
          cd dist && sha256sum *.AppImage > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: The AppImage runs by itself on clean systems
        run: tools/appimage_smoke.sh dist/*.AppImage ubuntu:22.04 ubuntu:24.04

      - name: A real window, under X11 (Xvfb) and Wayland (weston), with pictures of the screen
        # no game data exists here: the first-start dialog and the folder chooser are as far as it goes
        run: tools/appimage_desktop_smoke.sh dist/*.AppImage desktop

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: spirited-drive-linux-desktop-${{ github.sha }}
          path: desktop/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: spirited-drive-linux-${{ inputs.update_test && 'UPDATE-TEST-' || '' }}${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/README-linux.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
