name: tmp studio times
on:
  push:
    branches: [probe/dev1-studio-times]
permissions:
  contents: read
jobs:
  times:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
      RUN: ${{ matrix.os == 'ubuntu-24.04' && 'nix develop -c' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-24.04'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - if: matrix.os == 'macos-15'
        run: brew install ninja sdl3
      - name: Build
        run: |
          $RUN cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          $RUN cmake --build build
      - name: Wrap the editor and the game with a stopwatch
        run: |
          for b in tnfs-track-editor tnfs; do
            f=$(find "$PWD/build" -maxdepth 3 -type f -name $b | head -1); echo "$b: $f"
            mv "$f" "$f.real"
            printf '#!/usr/bin/env python3\nimport os,sys,time,subprocess\nt=time.monotonic()\nr=subprocess.call([%s]+sys.argv[1:])\nopen(os.environ.get("TIMES_LOG","/tmp/times.log"),"a").write("%%s\\t%%.3f\\t%%d\\t%%s\\n"%%(%s,time.monotonic()-t,r,chr(32).join(sys.argv[1:])))\nsys.exit(r if r>=0 else 128-r)\n' "'$f.real'" "'$b'" > "$f"
            chmod +x "$f"
          done
      - name: The six tests, one at a time
        run: |
          mkdir -p out
          for t in editor_light_window editor_car_two_originals editor_settings_first_run editor_original_track_flow_b editor_car_panel_clicks editor_headless_car_a; do
            rm -f /tmp/times.log; touch /tmp/times.log
            $RUN ctest --test-dir build -R "^$t\$" --output-on-failure --timeout 900 | tee out/$t.ctest
            cp /tmp/times.log out/$t.times
          done
      - name: Start-up against frames
        run: |
          e=$(find "$PWD/build" -maxdepth 3 -type f -name tnfs-track-editor.real | head -1)
          cd "$(dirname "$e")"
          for n in 1 2 12 50 200; do
            for i in 1 2 3; do
              w=$(mktemp -d); mkdir "$w/u" "$w/ws"
              python3 -c 'import sys,time,subprocess; t=time.monotonic(); r=subprocess.call(sys.argv[2:],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); print("frames",sys.argv[1],"s %.3f"%(time.monotonic()-t),"rc",r)' $n "$e" --user "$w/u" --workspace "$w/ws" --window 1280x800 --frames $n | tee -a "$GITHUB_WORKSPACE/out/frames.txt"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-times-${{ matrix.os }}
          path: out/
