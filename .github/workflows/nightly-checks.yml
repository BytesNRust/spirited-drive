# SPDX-License-Identifier: GPL-3.0-or-later
# Every night (and by hand: Actions > Nightly Checks > Run workflow), on main: what the checks of a push (checks.yml) leave out. The tests run on macOS Apple Silicon and
# Intel (macos-15-intel) in Release (Studio built), on Apple Silicon also with AddressSanitizer + UndefinedBehaviorSanitizer; on Linux (the flake's toolchain) in Release and with the sanitizers; and the game-only release configuration of the downloads. A compiler
# warning fails the build. ccache keeps the objects between runs: this job saves the cache on main, and the branches' checks restore it.
# As in checks.yml, ctest's times are kept from run to run (a key per job of its own, "nightly-..."), so the longest tests start first.
# Tests that need the CD's data skip themselves (there is no game data in CI).
# Also callable (workflow_call): the Release workflow runs it on the tagged commit. Every job is read-only (permissions: contents: read; the ccache is saved only on main).
# Jobs: macos (the matrix above), linux (release and sanitizers), game-only, windows-downloads (the Windows downloads' configuration: every test and the zip runs by itself), and the update notice's
# "local" part on macOS, Windows and Linux (update-infra-local-*; the live part is check-app-update-infra.yml).
name: Nightly Checks

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC, on main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly-checks-${{ github.ref }}
  # a newer run on the same ref cancels the older one, except on a tag: called by the Release workflow it must never be cut
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        build: [release, sanitizers]
        exclude:   # Intel runs the release build only: the sanitizers run on Apple Silicon (and on Linux, below)
          - runner: macos-15-intel
            build: sanitizers
        include:
          - build: release
            cmake: -DCMAKE_BUILD_TYPE=Release
          - build: sanitizers
            cmake: -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
    name: macos (${{ matrix.runner == 'macos-15-intel' && 'Intel' || 'Apple Silicon' }}) · ${{ matrix.build == 'release' && 'tests' || 'sanitizers' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install ninja sdl3 ccache
      - name: Pillow and rsvg-convert (the PSD, mask and icon tests are skipped without them)
        run: |
          brew install librsvg
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --only-binary=:all: pillow==12.3.0   # the flake's version
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-${{ matrix.runner }}-${{ matrix.build }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.runner }}-${{ matrix.build }}-
      - name: Configure
        run: |
          ccache -z
          cmake -S . -B build -G Ninja ${{ matrix.cmake }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: ccache statistics
        run: ccache -s
      - name: Save the ccache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-${{ matrix.runner }}-${{ matrix.build }}-${{ github.sha }}
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | grep -v '^ld: warning' | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Restore the tests' times
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-${{ matrix.runner }}-${{ matrix.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ctest-cost-nightly-${{ matrix.runner }}-${{ matrix.build }}-
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(sysctl -n hw.ncpu)"
      - name: Save the tests' times
        if: success() || failure()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-${{ matrix.runner }}-${{ matrix.build }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Linux, with the flake's own toolchain (nix develop: cmake, ninja, SDL3, gcc), in Release (every target and test) and with AddressSanitizer +
  # UndefinedBehaviorSanitizer. A compiler warning fails the build, as on the others.
  linux:
    strategy:
      fail-fast: false
      matrix:
        build: [release, sanitizers]
        include:
          - build: release
            cmake: -DCMAKE_BUILD_TYPE=Release
          # gcc's -Wstringop-overflow/-overread report "a region of size 0" at plain memcpy/memset/memmove calls once the sanitizers instrument the code (gcc's own
          # false positives; the release build of the same code has none): off in this job only, the sanitizers themselves check those accesses at run time
          - build: sanitizers
            cmake: -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -Wno-stringop-overflow -Wno-stringop-overread"
    name: linux · ${{ matrix.build == 'release' && 'tests' || 'sanitizers' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086   # v31
      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-ubuntu-24.04-${{ matrix.build }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-24.04-${{ matrix.build }}-
      - name: Configure
        run: |
          nix develop -c ccache -z
          nix develop -c cmake -S . -B build -G Ninja ${{ matrix.cmake }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          nix develop -c cmake --build build 2>&1 | tee build.log
      - name: ccache statistics
        run: nix develop -c ccache -s
      - name: Save the ccache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-ubuntu-24.04-${{ matrix.build }}-${{ github.sha }}
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Restore the tests' times
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-linux-${{ matrix.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ctest-cost-nightly-linux-${{ matrix.build }}-
      - name: Test
        run: nix develop -c ctest --test-dir build --output-on-failure --timeout 600 -j "$(nproc)"
      - name: Save the tests' times
        if: success() || failure()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-linux-${{ matrix.build }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The release's own configuration, tested every night: the downloads are the game only (-DTNFS_EDITOR=OFF) and a release build keeps no source-tree
  # data fallbacks (-DTNFS_RELEASE=ON); the tag workflows build and test exactly so, and nothing else here does, so a test that assumed Studio or the
  # source tree would show only on a tag. Apple Silicon alone, one job. (The tag workflows build it too.)
  game-only:
    name: macos · downloads build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install ninja sdl3 ccache
      - name: Pillow and rsvg-convert (the PSD, mask and icon tests are skipped without them)
        run: |
          brew install librsvg
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --only-binary=:all: pillow==12.3.0   # the flake's version
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-macos-15-game-only-${{ github.sha }}
          restore-keys: ccache-macos-15-game-only-
      - name: Configure
        run: |
          ccache -z
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Save the ccache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-macos-15-game-only-${{ github.sha }}
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | grep -v '^ld: warning' | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Restore the tests' times
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-macos-15-game-only-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ctest-cost-nightly-macos-15-game-only-
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(sysctl -n hw.ncpu)"
      - name: Save the tests' times
        if: success() || failure()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-macos-15-game-only-${{ github.run_id }}-${{ github.run_attempt }}

  # The Windows downloads' own configuration (-DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF, MSYS2 UCRT64): every test, then the zip tools/package_windows.sh makes, unpacked
  # and started with only Windows' own folders on the PATH.
  windows-downloads:
    name: windows · downloads build
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0   # the package's version carries the commit's hash
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c   # v2.34.0
        with:
          msystem: UCRT64
          update: false
          cache: true   # the MSYS2 install and its packages (setup-msys2's own cache, pinned)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-ccache
            git
            diffutils
      - name: Restore the ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-windows-ucrt64-downloads-${{ github.sha }}
          restore-keys: ccache-windows-ucrt64-downloads-
      - name: A /tmp for the programs that name one (the native programs read it as D:\tmp)
        run: mkdir -p /d/tmp
      - name: Configure
        run: |
          ccache -z
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Save the ccache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .ccache
          key: ccache-windows-ucrt64-downloads-${{ github.sha }}
      - name: No compiler warnings
        run: |
          if grep 'warning:' build.log | sort -u | grep .; then
            echo "::error::the build has compiler warnings"; exit 1
          fi
      - name: Restore the tests' times
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-windows-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ctest-cost-nightly-windows-downloads-
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300 -j "$(nproc)"
      - name: Save the tests' times
        if: success() || failure()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-nightly-windows-downloads-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package
        run: |
          tools/package_windows.sh build dist
          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
          cmake -E tar tf *.zip | grep -E 'Spirited Drive\.exe|SDL3\.dll|data/car_masks' | head -5
      - name: The package runs by itself
        # a clean Windows has none of MSYS2's folders: unpack into a new folder and start the exe with only Windows' own on PATH
        # (--mods-list opens no window and exits); a DLL missing from the zip makes the load fail (exit 0xC0000135) here and not on the runner's PATH
        run: |
          rm -rf unpacked && mkdir unpacked
          (cd unpacked && cmake -E tar xf ../dist/*.zip)
          ls unpacked/*/ | grep -q 'SDL3.dll'
          ls "unpacked/Spirited Drive/LICENSES/third-party"/*/* | grep -q . || { echo "no DLL licence texts in the package" >&2; exit 1; }
          mkdir user-clean
          env PATH=/c/Windows/System32:/c/Windows "unpacked/Spirited Drive/Spirited Drive.exe" --user "$PWD/user-clean" --mods-list

  # The update notice's "local" part: a build that stamps an OLD version (TNFS_UPDATE_TEST_VERSION) against servers of the script's own (the notice, and silence with
  # no hang for up to date, {"latest":null}, 403, 429, 5xx, HTML, garbage, nothing listening, a server that never answers, a proxy and a dead one). No network
  # to ours: it counts no start in the API's totals. The live part is check-app-update-infra.yml.
  update-infra-local-macos:
    name: update notice · local servers (macos)
    # not on a tag: CMakeLists.txt refuses an update test build on a tagged commit (a tag is a release); Release's own call skips these
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UPDATE_TEST_VERSION: "0.0.1"
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        run: brew install ninja sdl3
      - name: Build the update test (release configuration, old version)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_UPDATE_TEST_VERSION="$UPDATE_TEST_VERSION"
          cmake --build build --target tnfs
      - name: Unit tests of the check (no network)
        run: |
          cmake --build build --target test_update_check
          ctest --test-dir build --output-on-failure -R update_check
      - name: Silence and no hang (a server of our own)
        run: python3 tests/update_check_e2e.py local build/tnfs

  update-infra-local-windows:
    name: update notice · local servers (windows)
    # not on a tag: CMakeLists.txt refuses an update test build on a tagged commit (a tag is a release); Release's own call skips these
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    env:
      UPDATE_TEST_VERSION: "0.0.1"
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c   # v2.34.0
        with:
          msystem: UCRT64
          update: false
          cache: true   # the MSYS2 install and its packages (setup-msys2's own cache, pinned)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
            git
      - name: Build the update test (release configuration, old version)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF -DTNFS_UPDATE_TEST_VERSION="$UPDATE_TEST_VERSION"
          cmake --build build --target tnfs
      - name: Silence and no hang (a server of our own, Windows' own curl first on the PATH)
        run: |
          export PATH="/c/Windows/System32:$PATH"   # a player's machine has Windows' own curl.exe; MSYS2's would otherwise come first
          python tests/update_check_e2e.py local build/tnfs.exe

  update-infra-local-linux:
    name: update notice · local servers (linux)
    # not on a tag: CMakeLists.txt refuses an update test build on a tagged commit (a tag is a release); Release's own call skips these
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      UPDATE_TEST_VERSION: "0.0.1"
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086   # v31
      - name: Build the update test (release configuration, old version)
        run: |
          nix develop -c cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTNFS_RELEASE=ON -DTNFS_EDITOR=OFF -DTNFS_UPDATE_TEST_VERSION="$UPDATE_TEST_VERSION"
          nix develop -c cmake --build build --target tnfs
      - name: The curl the game runs
        # the game names it by its full path (core/update/update_check.h), as on a player's Ubuntu-based system
        run: |
          ls -l /usr/bin/curl
          /usr/bin/curl --version
      - name: Unit tests of the check (no network)
        run: |
          nix develop -c cmake --build build --target test_update_check
          nix develop -c ctest --test-dir build --output-on-failure -R update_check
      - name: Silence and no hang (a server of our own)
        run: python3 tests/update_check_e2e.py local build/tnfs
