# SPDX-License-Identifier: GPL-3.0-or-later
# The CD data for a job of the environment cd-data (notes: only main and the merge queue get its secrets): fetch.sh downloads and decrypts it into the runner's temp folder and
# links it as original/ in the checkout. Which asset, and the hash it must have, are in blob.txt, reviewed like the code. This step alone sees the key and the token.
name: CD data
description: Download and decrypt the CD data, and link it as original/
inputs:
  age-key:
    description: secrets.CD_AGE_KEY
    required: true
  repo-token:
    description: secrets.CD_REPO_TOKEN
    required: true
  repo:
    description: the private data repository
    default: BytesNRust/spirited-drive-data
  tag:
    description: the release that holds the asset
    default: cd-data
runs:
  using: composite
  steps:
    - name: Install age
      if: runner.os == 'Linux'
      shell: bash
      run: command -v age >/dev/null || sudo apt-get install -y -qq age || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
    - name: Install age (macOS, a pinned release)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sh "$GITHUB_ACTION_PATH/install_age.sh" "${RUNNER_TEMP:?}/age"
        echo "$RUNNER_TEMP/age" >> "${GITHUB_PATH:?}"
        command -v zstd >/dev/null || brew install --quiet zstd
    - name: Fetch, decrypt and link the data
      shell: bash
      env:
        CD_AGE_KEY: ${{ inputs.age-key }}
        CD_REPO_TOKEN: ${{ inputs.repo-token }}
        CD_REPO: ${{ inputs.repo }}
        CD_TAG: ${{ inputs.tag }}
      run: |
        sh "$GITHUB_ACTION_PATH/fetch.sh" "${RUNNER_TEMP:?}/cd" "$GITHUB_ACTION_PATH/blob.txt"
        ln -s "$RUNNER_TEMP/cd/original" "${GITHUB_WORKSPACE:?}/original"
